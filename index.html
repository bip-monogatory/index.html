<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#E8785D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monogatory">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Monogatory ~愛着が育む、モノとの長いお付き合い~</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone" id="app">

    <!-- S01 ようこそ・研究同意 -->
    <section class="screen" id="screen-welcome">
      <div class="onb">
        <div class="onb-hero" id="welcome-chara"></div>
        <h1 class="onb-title">Monogatory</h1>
        <h5 class="onb-subtitle">愛着が育む、モノとの長いお付き合い</h5>
        <p class="onb-lead">名前をつけて、話しかけて、いっしょに日々を重ねるアプリです。</p>
        <ul class="feature-list">
          <li><i data-ic="camera"></i><div><strong>登録</strong><span>名前・写真・使い始めた日を登録</span></div></li>
          <li><i data-ic="heart"></i><div><strong>育成</strong><span>話しかけたり、お手入れしたりして愛着度アップ</span></div></li>
          <li><i data-ic="calendar"></i><div><strong>記録</strong><span>いっしょに過ごした日数や記念日をふりかえり</span></div></li>
        </ul>
        <form id="welcome-form" class="card form" novalidate>
          <label class="check">
            <input type="checkbox" id="consent" name="consent">
            <span>研究の説明を読み、アプリの操作記録が研究目的で利用されることに同意します。</span>
          </label>
          <p class="error" id="welcome-error" role="alert"></p>
          <button class="btn primary block" type="submit">はじめる</button>
        </form>
      </div>
    </section>

    <!-- S02 登録・編集 -->
    <section class="screen" id="screen-register">
      <header class="subbar">
        <button class="icon-btn" type="button" data-action="register-back" id="register-back" aria-label="もどる"><i data-ic="left"></i></button>
        <h2 id="register-title">登録しよう</h2>
      </header>
      <form id="register-form" class="onb form" novalidate>
        <div class="reg-top">
          <div class="reg-chara" id="reg-chara"></div>
          <label class="photo-pick">
            <input type="file" id="photo-input" accept="image/*" class="visually-hidden">
            <span class="photo-frame" id="photo-frame"></span>
            <span class="photo-caption">写真</span>
          </label>
        </div>

        <label class="field">
          <span>名前 <em class="req">必須</em></span>
          <input name="name" id="reg-name" maxlength="20" placeholder="例: あおぞら" required>
        </label>
        <label class="field">
          <span>使い始めた日 <em class="req">必須</em></span>
          <input type="date" name="start" id="reg-start" min="1990-01-01" required>
          <small class="note">はっきりしない場合は、だいたいの日付でOKです。</small>
        </label>
        <label class="field">
          <span>種類</span>
          <select name="type" id="reg-type"></select>
        </label>
        <fieldset class="field">
          <legend>キャラクターの色</legend>
          <div class="swatches" id="reg-colors"></div>
        </fieldset>
        <fieldset class="field">
          <legend>一人称</legend>
          <div class="radio-pills" id="reg-pronoun"></div>
          <input name="pronoun-custom" id="reg-pronoun-custom" maxlength="10" placeholder="じぶんで入力（例：おいら）" autocomplete="off" hidden>
        </fieldset>
        <label class="field">
          <span>呼ばれ方 <small>（任意）</small></span>
          <input name="user" id="reg-user" maxlength="12" placeholder="例: けいこ（空欄なら「あなた」）">
        </label>
        <p class="error" id="register-error" role="alert"></p>
        <button class="btn primary block" type="submit" id="register-submit">この子をむかえる</button>
      </form>
    </section>

    <!-- メイン（タブ） -->
    <section class="screen" id="screen-main">
      <header class="appbar">
        <button class="appbar-me" type="button" data-action="go" data-to="settings" aria-label="この子の情報">
          <span class="appbar-photo" id="appbar-photo"></span>
          <span id="appbar-name"></span>
        </button>
        <span class="pill" id="appbar-days"></span>
        <button class="icon-btn" type="button" data-action="howto" aria-label="使い方"><i data-ic="help"></i></button>
      </header>

      <main>
        <section class="view" id="view-home"></section>
        <section class="view" id="view-chat">
          <div class="chat-list" id="chat-list" aria-live="polite"></div>
          <div class="chat-dock">
            <div class="chips" id="chat-chips"></div>
            <form id="chat-form" class="chat-form">
              <input id="chat-input" maxlength="200" placeholder="話しかけてみよう" autocomplete="off" enterkeyhint="send" aria-label="メッセージ">
              <button class="send-btn" type="submit" aria-label="送信"><i data-ic="send"></i></button>
            </form>
          </div>
        </section>
        <section class="view" id="view-record"></section>
        <section class="view" id="view-settings"></section>
      </main>

      <nav class="tabbar" aria-label="メインメニュー">
        <a href="#home" data-tab="home"><i data-ic="home"></i><span>ホーム</span></a>
        <a href="#chat" data-tab="chat"><i data-ic="chat"></i><span>おしゃべり</span></a>
        <a href="#record" data-tab="record"><i data-ic="calendar"></i><span>きろく</span></a>
        <a href="#settings" data-tab="settings"><i data-ic="settings"></i><span>せってい</span></a>
      </nav>
    </section>
  </div>

  <!-- きせかえシート -->
  <dialog id="dress" class="sheet">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h3>きせかえ</h3>
        <button class="icon-btn" type="button" data-action="close-dress" aria-label="閉じる"><i data-ic="x"></i></button>
      </div>
      <div class="dress-preview" id="dress-preview"></div>
      <div class="seg" id="dress-tabs"></div>
      <div class="item-grid" id="dress-items"></div>
    </div>
  </dialog>

  <!-- 汎用モーダル -->
  <dialog id="modal" class="modal">
    <div class="modal-inner">
      <div id="modal-body"></div>
      <button class="btn primary block" type="button" data-action="close-modal">OK</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
